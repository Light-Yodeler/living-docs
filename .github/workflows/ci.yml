name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Test & Verify Docs (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run living-docs two-way check on repository
        run: python3 scripts/check_docs.py --root .

      - name: Verify community health and security files
        run: python3 scripts/check_docs.py --root . --docs CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md --skip-reverse
